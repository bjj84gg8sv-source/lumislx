      height: 60px !important;

      width: 100% !important;

    }
    .footer-content {
      display: flex !important;
      align-items: center !important;
      justify-content: space-around !important;
      width: 100% !important;
      max-width: 1400px !important;
      padding: 0 40px !important;
      gap: 30px !important;
    }
    .footer-item {
      color: #fff !important;
      font-size: 14px !important;
      font-family: 'DreamOrphans', Arial, sans-serif !important;
      text-align: center !important;
      flex: 1 !important;

      letter-spacing: 0.08em !important;

    body.photography-page {
      background: #222;
      min-height: 100vh;
    }
    .magic-grid-demo {
      width: 100%;
      max-width: 1400px;
      margin: 60px auto 60px auto;
      position: relative;
      padding: 0;
    }
    @media (max-width: 450px) {
      .magic-grid-demo {
        grid-template-columns: 1fr;
      }
    }
    .magic-grid-demo .grid-item {
      color: #222;
      font-size: 2rem;
      font-weight: bold;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      width: 420px;
      max-width: 100%;
      height: auto;
      padding: 0;
      margin: 0 0 16px 0;
      display: block;
      box-sizing: border-box;
    }
    .magic-grid-demo .grid-item {
      position: relative;
    }
    .magic-grid-demo .grid-item img,
    #modalImg {
      display: block;
      width: 100%;
      max-width: 700px;
      height: auto;
      max-height: 900px;
      margin: 0;
      padding: 0;
      background: transparent;
      border-radius: 12px;
      transition: box-shadow 0.25s, filter 0.25s;
      cursor: pointer;
      position: relative;
      z-index: 1;
      user-select: none;
      -webkit-user-drag: none;
    }
    .magic-grid-demo .grid-item::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 16px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      box-shadow: 0 0 0 0 #ff00ff, 0 0 0 0 #fff;
    }
    .magic-grid-demo .grid-item:hover img {
      box-shadow: 0 0 16px 4px #ff00ff88, 0 0 32px 8px #ff00ff44, 0 8px 32px rgba(0,0,0,0.18);
      filter: brightness(1.06) saturate(1.15);
      z-index: 2;
    }
    .magic-grid-demo .grid-item:hover::after {
      opacity: 1;
      box-shadow: 0 0 24px 8px #ff00ff44, 0 0 48px 16px #ff00ff22;
    }
    .magic-grid-demo .grid-item img:hover {
      box-shadow: 0 0 16px 4px #ff00ff88, 0 0 32px 8px #ff00ff44, 0 8px 32px rgba(0,0,0,0.18);
      filter: brightness(1.06) saturate(1.15);
      z-index: 2;
    }

    /* Modal styles */
    .photo-modal {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(20, 0, 30, 0.92);
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }
    .photo-modal.active {
      display: flex;
      opacity: 1;
    }
    .photo-modal img {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.28);
      background: #222;
    }
    .photo-modal .close-btn {
      position: absolute;
      top: 32px;
      right: 48px;
      font-size: 2.5rem;
      color: #fff;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 10001;
      filter: drop-shadow(0 2px 8px #000);
      transition: color 0.2s;
    }
    .photo-modal .close-btn:hover {
      color: #ff00ff;
    }
  </style>
</head>
<body class="photography-page">

    <script src="https://cdn.jsdelivr.net/npm/magic-grid@3.1.2/dist/magic-grid.min.js"></script>
    <script>
      // List of photo filenames in creation order (oldest to newest)
      // To update: add new filenames to this array in the order you want them to appear
      // Dynamically generated from directory listing
      const photoFiles = [
        "1.JPG","2.JPG","3.jpeg","4.jpeg","5.jpeg","6.jpeg","7.JPG","8.jpg","9.jpg","10.jpg","11.jpg","12.jpg","13.jpg","14.jpg","15.jpg","16.jpg","17.jpg","18.jpg","19.jpeg","20.jpeg","21.jpeg","22.jpeg","23.jpg","24.jpg","25.jpg","26.jpg","27.jpg","28.jpg","29.jpg"
      ];

      // Sort numerically by filename (highest number first)
      photoFiles.sort((a, b) => {
        // Extract leading number from filename
        const numA = parseInt(a.match(/\d+/)?.[0] || '0', 10);
        const numB = parseInt(b.match(/\d+/)?.[0] || '0', 10);
        return numB - numA;
      });

      function createPhotoTile(filename) {
        const div = document.createElement('div');
        div.className = 'grid-item';
        const img = document.createElement('img');
        img.src = `Assets/Photography/Photos/${filename}`;
        img.alt = filename;
        img.loading = 'eager';
        img.decoding = 'async';
        img.style.width = '100%';
        img.style.height = 'auto';
        img.setAttribute('draggable', 'false');
        img.setAttribute('oncontextmenu', 'return false;');
        img.addEventListener('click', function() {
          openPhotoModal(img.src, img.alt);
        });
        div.appendChild(img);
        return div;
      }

      // Modal logic
      function openPhotoModal(src, alt) {
        const modal = document.getElementById('photoModal');
        const modalImg = document.getElementById('modalImg');
        modalImg.src = src;
        modalImg.alt = alt;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      }
      function closePhotoModal() {
        const modal = document.getElementById('photoModal');
        modal.classList.remove('active');
        document.body.style.overflow = '';
        setTimeout(() => {
          document.getElementById('modalImg').src = '';
        }, 200);
      }
      document.getElementById('closeModalBtn').addEventListener('click', closePhotoModal);
      document.getElementById('photoModal').addEventListener('click', function(e) {
        if (e.target === this) closePhotoModal();
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closePhotoModal();
      });

      document.addEventListener('DOMContentLoaded', function() {
        // Navigation bar logic handled by script.js

        const grid = document.getElementById('magic-grid-demo');
        grid.innerHTML = '';

        // Preload all photos in parallel, then build the entire grid in one
        // go and cascade-fade the tiles in top-down. This avoids any mid-load
        // layout shifts — the layout is stable from the first frame visible.
        const preloads = photoFiles.map(filename => new Promise(resolve => {
          const img = new Image();
          img.onload = img.onerror = () => resolve();
          img.src = `Assets/Photography/Photos/${filename}`;
        }));

        Promise.all(preloads).then(() => {
          // All photos cached — build tiles
          const tiles = photoFiles.map(f => {
            const tile = createPhotoTile(f);
            const tileImg = tile.querySelector('img');
            tileImg.style.opacity = '0';
            tileImg.style.transition = 'opacity 0.6s ease';
            return tile;
          });
          tiles.forEach(tile => grid.appendChild(tile));

          // Lay out the grid (positions are final and stable from the start)
          const magicGrid = new MagicGrid({
            container: '#magic-grid-demo',
            static: true,
            animate: false,
            gutter: 30,
            maxColumns: 3,
            useMin: true
          });
          magicGrid.listen();

          // Cascade fade-in, top-down (each tile reveals 50ms after the previous)
          tiles.forEach((tile, i) => {
            setTimeout(() => {
              const tileImg = tile.querySelector('img');
              if (tileImg) tileImg.style.opacity = '1';
            }, i * 50);
          });
        });
      });
    </script>
    <script src="script.js"></script>
  </body>
