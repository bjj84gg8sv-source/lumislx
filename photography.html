    body.photography-page {
      background-image: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), url('Assets/Photography/Photo Background.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
    }

    .photo-gallery-grid {
      column-count: 3;
      column-gap: 30px;
      padding: 80px 40px 60px 40px;
      max-width: 100%;
      margin: 0 auto;
    }

    .photo-grid-item {
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: box-shadow 300ms ease, opacity 300ms ease;
      margin-bottom: 30px;
      break-inside: avoid;
      width: 100%;
    }

    .photo-grid-item:hover {
      opacity: 1.15;
      box-shadow: 0 16px 48px rgba(255, 0, 255, 0.4);
    }

    .photo-grid-item img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    @media (max-width: 1024px) {
      .photo-gallery-grid {
        column-count: 2;
      }
    }

    @media (max-width: 640px) {
      .photo-gallery-grid {
        column-count: 1;
      }
    }
  </style>

  <script src="script.js"></script>
  <script>
    // Photo gallery modal functionality
    const photoModal = document.getElementById('photoModal');
    const photoModalImage = document.getElementById('photoModalImage');
    const photoModalTitle = document.getElementById('photoModalTitle');
    const photoModalSubtitle = document.getElementById('photoModalSubtitle');
    const closePhotoModal = document.getElementById('closePhotoModal');
    const galleryItems = document.querySelectorAll('.photo-grid-item img');

    galleryItems.forEach(img => {
      img.addEventListener('click', (e) => {
        photoModalImage.src = img.src;
        photoModalTitle.textContent = img.dataset.title || '';
        photoModalSubtitle.textContent = img.dataset.subtitle || '';
        photoModal.style.display = 'flex';
        photoModal.classList.add('active');
        document.body.style.overflow = 'hidden';

        // Check if image is vertical after it loads
        const checkAndSetVertical = () => {
          if (photoModalImage.naturalHeight > photoModalImage.naturalWidth) {
            photoModalImage.classList.add('vertical');
          } else {
            photoModalImage.classList.remove('vertical');
          }
        };

        if (photoModalImage.complete) {
          checkAndSetVertical();
        } else {
          photoModalImage.addEventListener('load', checkAndSetVertical, { once: true });
        }
      });
    });

    closePhotoModal.addEventListener('click', () => {
      photoModal.style.display = 'none';
      photoModal.classList.remove('active');
      document.body.style.overflow = 'auto';
    });

    photoModal.addEventListener('click', (e) => {
      if (e.target === photoModal || e.target === document.querySelector('.photo-modal-backdrop')) {
        photoModal.style.display = 'none';
        photoModal.classList.remove('active');
        document.body.style.overflow = 'auto';
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && photoModal.style.display === 'flex') {
        photoModal.style.display = 'none';
        photoModal.classList.remove('active');
        document.body.style.overflow = 'auto';
      }
    });
  </script>
